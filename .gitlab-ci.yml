# Integración continua de NeoTube 2.0 (Rust).
#
# Dos trabajos: compilar y probar. `cargo test` no necesita red, ni VLC, ni
# vídeo: cubre parsers con fixtures guardados, la cola, la sesión y el
# almacenamiento. Por eso puede correr en un contenedor limpio.
stages:
  - build
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

cache:
  key: "cargo-$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry
    - target

build:
  stage: build
  image: rust:latest
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/neotube2
    expire_in: 1 week

test:
  stage: test
  image: rust:latest
  script:
    - cargo test --all-targets
